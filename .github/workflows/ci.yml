name: standalone-contracts

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  parser-fuzzing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        target: [json, provider]
    steps:
      - uses: actions/checkout@v7
      - name: Install the fuzzing compiler
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Configure instrumented parsers
        run: cmake -B build-fuzz -DCMAKE_C_COMPILER=clang -DCMAKE_BUILD_TYPE=RelWithDebInfo -DASMODEL_BUILD_TESTS=OFF -DASMODEL_BUILD_FUZZERS=ON
      - name: Build the selected target
        run: cmake --build build-fuzz --target asmodel-fuzz-${{ matrix.target }} -j 4
      - name: Fuzz bounded protocol inputs
        run: |
          mkdir -p artifacts corpus
          cp fuzz/corpus/${{ matrix.target }}/* corpus/
          build-fuzz/asmodel-fuzz-${{ matrix.target }} -seed=1 -max_len=16384 -timeout=5 -max_total_time=30 -rss_limit_mb=512 -print_final_stats=1 -artifact_prefix=artifacts/ corpus
      - name: Preserve any failing inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parser-fuzz-${{ matrix.target }}
          path: artifacts/
          if-no-files-found: ignore
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: gcc, cc: gcc, flags: '' }
          - { name: clang-sanitizers, cc: clang, flags: '-fsanitize=address,undefined -fno-omit-frame-pointer' }
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install HTTP test dependency
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CFLAGS: ${{ matrix.flags }}
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DASMODEL_BUILD_TESTS=ON
      - name: Require the HTTP conformance target
        # Missing CURL/Python must not silently remove the provider tests.
        run: cmake --build build --target asmodel-openai-smoke -j 4
      - name: Build
        run: cmake --build build -j 4
      - name: Test
        run: ctest --test-dir build --output-on-failure
