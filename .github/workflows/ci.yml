name: standalone-contracts

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: gcc, cc: gcc, flags: '' }
          - { name: clang-sanitizers, cc: clang, flags: '-fsanitize=address,undefined -fno-omit-frame-pointer' }
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install HTTP test dependency
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CFLAGS: ${{ matrix.flags }}
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DASMODEL_BUILD_TESTS=ON
      - name: Require the HTTP conformance target
        # Missing CURL/Python must not silently remove the provider tests.
        run: cmake --build build --target asmodel-openai-smoke -j 4
      - name: Build
        run: cmake --build build -j 4
      - name: Test
        run: ctest --test-dir build --output-on-failure
